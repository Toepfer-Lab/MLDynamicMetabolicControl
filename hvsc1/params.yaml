# params.yaml — HvSC1 community surrogate pipeline
# All paths are relative to the repo root (not this file's directory).

hvsc1_data:
  n_samples: 20000
  fraction: 0.5
  model_path: model/hvsc1_comm.pickle
  output: data/hvsc1_training.npz

hvsc1_training:
  hidden_dim: 128
  n_layers: 2
  epochs: 3000
  patience: 100
  lr: 0.001
  # model name written by train_surrogate.py:
  # trained_models/hvsc1_community_input-27_output-27_hidden-128.pt

hvsc1_simulate_lp:
  n_landscape: 200
  n_steps: 80
  dt: 0.1
  fraction: 0.5
  convergence_threshold: 0.99

hvsc1_simulate_surrogate:
  n_steps: 80
  dt: 0.1
