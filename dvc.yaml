stages:

  generate_data:
    cmd: >
      python scripts/generate_fba_data.py
      --model-path ${data.model_path}
      --vman ${data.vman}
      --condition ${data.condition}
      --n-samples ${data.n_samples}
      --objective ${data.objective}
    deps:
      - scripts/generate_fba_data.py
      - src/FBA_data_generation.py
      - src/flux_config.py
    params:
      - data.vman
      - data.condition
      - data.n_samples
      - data.objective
      - data.model_path
    outs:
      - data/fba_data_${data.vman}_${data.condition}_${data.objective}.npz

  train_surrogate:
    cmd: >
      python scripts/train_surrogate.py
      --vman ${data.vman}
      --condition ${data.condition}
      --hidden-dim ${training.hidden_dim}
      --epochs ${training.epochs}
      --patience ${training.patience}
      --lr ${training.lr}
      --model-name ${data.vman}_${data.objective}_trained_model_input-1_output-4_hidden-${training.hidden_dim}
    deps:
      - data/fba_data_${data.vman}_${data.condition}_${data.objective}.npz
      - scripts/train_surrogate.py
      - src/surrogateNN.py
      - src/runtime_utils.py
      - src/flux_config.py
    params:
      - training.hidden_dim
      - training.epochs
      - training.patience
      - training.lr
      - data.vman
      - data.condition
      - data.objective
    outs:
      - trained_models/${data.vman}_${data.objective}_trained_model_input-1_output-4_hidden-${training.hidden_dim}.pt

  optimize:
    cmd: >
      python scripts/optimize_vman.py
      --checkpoint trained_models/${data.vman}_${data.objective}_trained_model_input-1_output-4_hidden-${training.hidden_dim}.pt
      --t-start ${optimize.t_start}
      --t-end ${optimize.t_end}
      --num-intervals ${optimize.num_intervals}
      --n-eval ${optimize.n_eval}
      --objective ${optimize.objective}
      --initial-state ${optimize.initial_state}
      --output-path results/optimize_vman_${data.vman}_${data.objective}_hidden-${training.hidden_dim}_tend-${optimize.t_end}_N-${optimize.num_intervals}.npz
      --logs-path results/optimize_vman_${data.vman}_${data.objective}_hidden-${training.hidden_dim}_tend-${optimize.t_end}_N-${optimize.num_intervals}_logs.npz
    deps:
      - trained_models/${data.vman}_${data.objective}_trained_model_input-1_output-4_hidden-${training.hidden_dim}.pt
      - scripts/optimize_vman.py
      - src/optim.py
    params:
      - optimize
      - data.vman
      - data.objective
      - training.hidden_dim
    outs:
      - results/optimize_vman_${data.vman}_${data.objective}_hidden-${training.hidden_dim}_tend-${optimize.t_end}_N-${optimize.num_intervals}.npz
      - results/optimize_vman_${data.vman}_${data.objective}_hidden-${training.hidden_dim}_tend-${optimize.t_end}_N-${optimize.num_intervals}_logs.npz

  plot:
    cmd: >
      python scripts/plot_optimize_vman.py
      --results results/optimize_vman_${data.vman}_${data.objective}_hidden-${training.hidden_dim}_tend-${optimize.t_end}_N-${optimize.num_intervals}.npz
      --logs results/optimize_vman_${data.vman}_${data.objective}_hidden-${training.hidden_dim}_tend-${optimize.t_end}_N-${optimize.num_intervals}_logs.npz
      --outdir plots/${data.objective}_tend-${optimize.t_end}_N-${optimize.num_intervals}
    deps:
      - results/optimize_vman_${data.vman}_${data.objective}_hidden-${training.hidden_dim}_tend-${optimize.t_end}_N-${optimize.num_intervals}.npz
      - results/optimize_vman_${data.vman}_${data.objective}_hidden-${training.hidden_dim}_tend-${optimize.t_end}_N-${optimize.num_intervals}_logs.npz
      - scripts/plot_optimize_vman.py
    outs:
      - plots/${data.objective}_tend-${optimize.t_end}_N-${optimize.num_intervals}/

  # -----------------------------
  # Greedy (opt-in) stages
  # Run with: dvc repro plot_greedy
  # -----------------------------

  optimize_greedy:
    cmd: >
      python scripts/greedily_optimize_vman.py
      --checkpoint trained_models/${data.vman}_${data.objective}_trained_model_input-1_output-4_hidden-${training.hidden_dim}.pt
      --t-start ${optimize.t_start}
      --t-end ${optimize.t_end}
      --n-eval ${optimize.n_eval}
      --objective ${optimize.objective}
      --initial-state ${optimize.initial_state}
      --log-full-every-k ${optimize.log_full_every_k}
      --mode ${optimize_greedy.mode}
      --v-right ${optimize_greedy.v_right}
      --v-left ${optimize_greedy.v_left}
      --v-left-bounds ${optimize_greedy.v_left_bounds}
      --tau-bounds ${optimize_greedy.tau_bounds}
      --n-iterations ${optimize_greedy.n_iterations}
      --joint-polish ${optimize_greedy.joint_polish}
      --split-grid-size ${optimize_greedy.split_grid_size}
      --min-dt ${optimize_greedy.min_dt}
      --inner-polish-maxiter ${optimize_greedy.inner_polish_maxiter}
      --final-polish-maxiter ${optimize_greedy.final_polish_maxiter}
      --n_cuts ${optimize_greedy.n_cuts}
      --output-path results/greedy/greedy_optimize_vman_${data.vman}_${data.objective}_hidden-${training.hidden_dim}_tend-${optimize.t_end}.npz
      --logs-path results/greedy/greedy_optimize_vman_${data.vman}_${data.objective}_hidden-${training.hidden_dim}_tend-${optimize.t_end}_logs.npz
    deps:
      - trained_models/${data.vman}_${data.objective}_trained_model_input-1_output-4_hidden-${training.hidden_dim}.pt
      - scripts/greedily_optimize_vman.py
      - src/greedy_optim.py
      - src/hybrid_model.py
      - src/runtime_utils.py
      - src/surrogateNN.py
      - src/flux_config.py
    params:
      - optimize
      - optimize_greedy
      - data.vman
      - data.objective
      - training.hidden_dim
    outs:
      - results/greedy/:
          cache: false
          persist: true

  plot_greedy:
    cmd: >
      python scripts/greedy_plot.py
      --latest results/greedy/greedy_optimize_vman_${data.vman}_${data.objective}_hidden-${training.hidden_dim}_tend-${optimize.t_end}
      --outdir plots/greedy_${data.objective}_tend-${optimize.t_end}
    deps:
      - results/greedy/
      - scripts/greedy_plot.py
    outs:
      - plots/greedy_${data.objective}_tend-${optimize.t_end}/

  # ------------------------------------------------------------------
  # iJO1366 genome-scale benchmark pipeline (Stages 2-3)
  # Run with: dvc repro ijo_train_surrogate
  # ------------------------------------------------------------------

  ijo_generate_data:
    cmd: >
      python scripts/ijo1366_generate_data.py
      --n-samples ${ijo_data.n_samples}
      --condition ${ijo_data.condition}
      --model-path ${ijo_data.model_path}
    deps:
      - scripts/ijo1366_generate_data.py
      - src/FBA_data_generation.py
      - src/flux_config_ijo1366.py
    params:
      - ijo_data
    outs:
      - data/ijo1366_${ijo_data.condition}.npz

  ijo_train_surrogate:
    cmd: >
      python scripts/train_surrogate.py
      --vman ijo1366
      --condition ${ijo_data.condition}
      --hidden-dim ${ijo_training.hidden_dim}
      --epochs ${ijo_training.epochs}
      --patience ${ijo_training.patience}
      --lr ${ijo_training.lr}
      --data-path data/ijo1366_${ijo_data.condition}.npz
      --model-name ijo1366_${ijo_data.condition}_hidden-${ijo_training.hidden_dim}
    deps:
      - data/ijo1366_${ijo_data.condition}.npz
      - scripts/train_surrogate.py
      - src/surrogateNN.py
      - src/runtime_utils.py
    params:
      - ijo_training
      - ijo_data.condition
    outs:
      - trained_models/ijo1366_${ijo_data.condition}_hidden-${ijo_training.hidden_dim}.pt

  ijo_plot_flux_maps:
    cmd: >
      python scripts/ijo1366_plot_flux_maps.py
      --data-path data/ijo1366_${ijo_data.condition}.npz
      --checkpoint trained_models/ijo1366_${ijo_data.condition}_hidden-${ijo_training.hidden_dim}.pt
      --outdir plots/ijo1366_flux_maps
      --n-ldh-slices ${ijo_plot.n_ldh_slices}
      --n-ackr-sweep ${ijo_plot.n_ackr_sweep}
      --band-fraction ${ijo_plot.band_fraction}
    deps:
      - scripts/ijo1366_plot_flux_maps.py
      - data/ijo1366_${ijo_data.condition}.npz
      - trained_models/ijo1366_${ijo_data.condition}_hidden-${ijo_training.hidden_dim}.pt
      - src/flux_config_ijo1366.py
      - src/runtime_utils.py
      - src/surrogateNN.py
    params:
      - ijo_data.condition
      - ijo_training.hidden_dim
      - ijo_plot
    outs:
      - plots/ijo1366_flux_maps/:
          cache: false
          persist: true

  ijo_benchmark_lp:
    cmd: >
      python scripts/ijo1366_benchmark_lp.py
      --grid-n ${ijo_benchmark.grid_n}
      --t-end ${ijo_benchmark.t_end}
      --bm0 ${ijo_benchmark.bm0}
      --glc0 ${ijo_benchmark.glc0}
      --condition ${ijo_data.condition}
      --model-path ${ijo_data.model_path}
      --data-path data/ijo1366_${ijo_data.condition}.npz
      --output results/ijo1366_benchmark_lp.npz
    deps:
      - scripts/ijo1366_benchmark_lp.py
      - data/ijo1366_${ijo_data.condition}.npz
      - src/flux_config_ijo1366.py
      - src/runtime_utils.py
    params:
      - ijo_benchmark
      - ijo_data.condition
      - ijo_data.model_path
    outs:
      - results/ijo1366_benchmark_lp.npz:
          cache: false
          persist: true

  ijo_benchmark_surrogate:
    cmd: >
      python scripts/ijo1366_benchmark_surrogate.py
      --grid-n ${ijo_benchmark.grid_n}
      --t-end ${ijo_benchmark.t_end}
      --bm0 ${ijo_benchmark.bm0}
      --glc0 ${ijo_benchmark.glc0}
      --data-path data/ijo1366_${ijo_data.condition}.npz
      --checkpoint trained_models/ijo1366_${ijo_data.condition}_hidden-${ijo_training.hidden_dim}.pt
      --output results/ijo1366_benchmark_surrogate.npz
    deps:
      - scripts/ijo1366_benchmark_surrogate.py
      - data/ijo1366_${ijo_data.condition}.npz
      - trained_models/ijo1366_${ijo_data.condition}_hidden-${ijo_training.hidden_dim}.pt
      - src/flux_config_ijo1366.py
      - src/runtime_utils.py
      - src/surrogateNN.py
    params:
      - ijo_benchmark
      - ijo_data.condition
      - ijo_training.hidden_dim
    outs:
      - results/ijo1366_benchmark_surrogate.npz:
          cache: false
          persist: true

  ijo_benchmark_piecewise_lp:
    cmd: >
      python scripts/ijo1366_benchmark_piecewise_lp.py
      --grid-n ${ijo_benchmark_piecewise.grid_n}
      --tau ${ijo_benchmark_piecewise.tau}
      --t-end ${ijo_benchmark_piecewise.t_end}
      --bm0 ${ijo_benchmark_piecewise.bm0}
      --glc0 ${ijo_benchmark_piecewise.glc0}
      --condition ${ijo_data.condition}
      --model-path ${ijo_data.model_path}
      --lp-results results/ijo1366_benchmark_lp.npz
      --data-path data/ijo1366_${ijo_data.condition}.npz
      --output results/ijo1366_benchmark_piecewise_lp.npz
    deps:
      - scripts/ijo1366_benchmark_piecewise_lp.py
      - results/ijo1366_benchmark_lp.npz
      - data/ijo1366_${ijo_data.condition}.npz
      - src/flux_config_ijo1366.py
      - src/runtime_utils.py
    params:
      - ijo_benchmark_piecewise
      - ijo_data.condition
      - ijo_data.model_path
    outs:
      - results/ijo1366_benchmark_piecewise_lp.npz:
          cache: false
          persist: true

  ijo_benchmark_piecewise_surrogate:
    cmd: >
      python scripts/ijo1366_benchmark_piecewise_surrogate.py
      --grid-n ${ijo_benchmark_piecewise.grid_n}
      --tau ${ijo_benchmark_piecewise.tau}
      --t-end ${ijo_benchmark_piecewise.t_end}
      --bm0 ${ijo_benchmark_piecewise.bm0}
      --glc0 ${ijo_benchmark_piecewise.glc0}
      --piecewise-lp-results results/ijo1366_benchmark_piecewise_lp.npz
      --data-path data/ijo1366_${ijo_data.condition}.npz
      --checkpoint trained_models/ijo1366_${ijo_data.condition}_hidden-${ijo_training.hidden_dim}.pt
      --output results/ijo1366_benchmark_piecewise_surrogate.npz
    deps:
      - scripts/ijo1366_benchmark_piecewise_surrogate.py
      - results/ijo1366_benchmark_piecewise_lp.npz
      - data/ijo1366_${ijo_data.condition}.npz
      - trained_models/ijo1366_${ijo_data.condition}_hidden-${ijo_training.hidden_dim}.pt
      - src/flux_config_ijo1366.py
      - src/runtime_utils.py
      - src/surrogateNN.py
    params:
      - ijo_benchmark_piecewise
      - ijo_data.condition
      - ijo_training.hidden_dim
    outs:
      - results/ijo1366_benchmark_piecewise_surrogate.npz:
          cache: false
          persist: true

    ijo_plot_piecewise_benchmark:
    cmd: >
      python scripts/ijo1366_plot_piecewise_benchmark.py
      --lp-results results/ijo1366_benchmark_piecewise_lp.npz
      --surrogate-results results/ijo1366_benchmark_piecewise_surrogate.npz
      --outdir plots/ijo1366_piecewise_benchmark
    deps:
      - scripts/ijo1366_plot_piecewise_benchmark.py
      - results/ijo1366_benchmark_piecewise_lp.npz
      - results/ijo1366_benchmark_piecewise_surrogate.npz
      - src/runtime_utils.py
    outs:
      - plots/ijo1366_piecewise_benchmark/:
          cache: false
          persist: true
