# params.yaml

data:
  model_path: model/ECC2comp_configured
  vman: ACKr
  condition: anaerobic
  n_samples: 10000
  objective: EX_Biomass

training:
  hidden_dim: 4
  epochs: 501
  patience: 50
  lr: 0.001

optimize:
  log_full_every_k: 10 
  t_start: 0.0
  t_end: 18.0          # <-- change to 24.0 later
  num_intervals: 8  # <-- change to 40 later
  n_eval: 1000
  objective: ethanol
  initial_state: 10.0 0.0 0.01

ijo_data:
  model_path: model/iJO1366.xml
  condition: anaerobic
  n_samples: 50000

ijo_training:
  hidden_dim: 16
  epochs: 2000
  patience: 50
  lr: 0.001

ijo_plot:
  n_ldh_slices: 4
  n_ackr_sweep: 300
  band_fraction: 0.06

ijo_benchmark:
  grid_n: 10      # N×N = 100 simulations per route
  t_end: 10.0     # h
  bm0: 0.01       # gDW/L
  glc0: 10.0      # mM

ijo_benchmark_piecewise:
  grid_n: 10      # N×N phase-2 grid = 100 simulations per route
  tau: 5.0        # phase switch time (h): grow for tau h, produce for t_end-tau h
  t_end: 10.0     # h
  bm0: 0.01       # gDW/L
  glc0: 10.0      # mM

optimize_greedy:
  mode: k_cuts   # "single_cut_to_zero" or "k_cuts"
  # single_cut_to_zero params
  v_right: 0.0               # ACKr value in production phase (fixed at 0)
  v_left: 7.66               # warm-start hint for growth-phase ACKr (known growth-optimal value)
  v_left_bounds: 0.0 10.0    # ACKr search range for growth phase
  joint_polish: 1        # jointly optimise (tau, v_left) in final polish
  n_iterations: 5            # zoom-in iterations (each halves search window)
  # k_cuts params
  n_cuts: 3
  # temporal window [t_lo, t_hi] restricting where cuts are placed (hours, both modes)
  tau_bounds: 10.0 14.0
  # shared
  split_grid_size: 10
  min_dt: 0.001
  inner_polish_maxiter: 80
  final_polish_maxiter: 300
