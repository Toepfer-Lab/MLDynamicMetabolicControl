# params.yaml

data:
  model_path: model/iCH360.xml
  vman: ACKr
  condition: anaerobic
  n_samples: 1000

training:
  hidden_dim: 4
  epochs: 500
  patience: 50
  lr: 0.001

optimize:
  t_start: 0.0
  t_end: 100.0          # <-- change to 24.0 later
  num_intervals: 10  # <-- change to 40 later
  n_eval: 1000
  objective: ethanol
  bounds_lower: -9.0
  bounds_upper: -1.0
  initial_state: 10.0 0.0 0.01
